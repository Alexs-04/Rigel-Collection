spring.application.name=rigel-test

# H2 in-memory database. The "rigel" schema is created on connect because the main
# configuration sets hibernate.default_schema=rigel.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS rigel
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

server.port=0

# Values that the main configuration takes from the environment
origin=http://localhost:5173
spring.mail.host=localhost
spring.mail.username=test@rigel.local
spring.mail.password=
app.mail.from=test@rigel.local

# JWT (Base64, 48 bytes)
jwt.secret=dGVzdC1vbmx5LWtleS1yaWdlbC1qd3QtMjU2LWJpdHMtbWluaW11bS0xMjM0NTY=
jwt.expiration=3600000
jwt.refresh=86400000

# Do not write uploads into the repository during tests
image.storage.local-path=${java.io.tmpdir}/rigel-test-uploads

logging.level.com.korebit.rigel=INFO

# JavaMailSender is mocked in tests; the mail health check needs a real JavaMailSenderImpl
management.health.mail.enabled=false
