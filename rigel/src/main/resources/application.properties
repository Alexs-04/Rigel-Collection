spring.application.name=Rigel
# Frontend origin allowed by CORS; also the base URL of the links sent by email.
origin=${ORIGIN:http://localhost:5173}
# Local network sharing (optional)
# When enabled, browsers on the LAN may call the API in addition to the origin above, so the app
# can be opened from other devices (e.g. http://192.168.0.25:5173).
# Patterns are comma separated; the default covers every host of 192.168.0.0/24 on any port.
# Use http://192.168.*.*:[*] to cover the whole 192.168.0.0/16 range.
app.cors.local-network.enabled=${CORS_LOCAL_NETWORK:false}
app.cors.local-network.patterns=${CORS_LOCAL_NETWORK_PATTERNS:http://192.168.0.*:[*]}
# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/rigel_db}
spring.jpa.properties.hibernate.default_schema=rigel
spring.datasource.username=${DB_USERNAME:rigel_root}
#TODO: Change the password to a secure one before deploying to production
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.open-in-view=false
# Server Configuration
server.port=8080
spring.thymeleaf.check-template-location=false
# Mail Configuration (optional)
# Leave EMAIL_ADDRESS / EMAIL_PASSWORD unset to run without email: the application still starts and
# activation / password-reset links are written to the server log instead of being sent.
spring.mail.host=${EMAIL_HOST:smtp.gmail.com}
spring.mail.port=${EMAIL_PORT:587}
spring.mail.username=${EMAIL_ADDRESS:}
spring.mail.password=${EMAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Enable only when mail is configured; otherwise /actuator/health would report DOWN.
management.health.mail.enabled=${EMAIL_HEALTH_CHECK:false}
app.base-url=${origin}
app.mail.from=${EMAIL_ADDRESS:}
app.mail.token-expiration-hours=48
# JWT Configuration
# Base64-encoded HMAC key of at least 32 bytes. Override with the JWT_SECRET env var outside local dev.
# Generate one with: openssl rand -base64 48
# The fallback below is for local development only (non-Base64 chars are ignored by the decoder).
jwt.secret=${JWT_SECRET:mySuperSecretKeyThatIsAtLeast32CharactersLong123!}
# Access token TTL (ms): 1 hour
jwt.expiration=${JWT_EXPIRATION_MS:3600000}
# Refresh token TTL (ms): 24 hours
jwt.refresh=${JWT_REFRESH_MS:86400000}
# Logging
logging.pattern.level=%5p [corr:%X{correlationId:-N/A}]
logging.level.com.korebit.rigel.interceptor.LogInterceptor=DEBUG
# Cloudinary Configuration (optional)
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.folder=rigel/products
# Image Storage Configuration
image.storage.local-path=${IMAGE_STORAGE_PATH:./uploads}
