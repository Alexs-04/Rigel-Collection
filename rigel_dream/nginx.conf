# Rendered by the nginx image at startup (envsubst replaces ${BACKEND_URL}).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Product images are uploaded as Base64 JSON.
    client_max_body_size 15m;

    # API: /api/foo -> ${BACKEND_URL}/foo
    # The original Host header is forwarded so the backend sees the request as same-origin.
    location /api/ {
        proxy_pass ${BACKEND_URL}/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fingerprinted build output can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: unknown paths fall back to index.html (client-side routing).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
