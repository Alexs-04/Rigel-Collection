spring.application.name=Rigel
# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.datasource.url=jdbc:postgresql://localhost:5432/rigel_db
spring.jpa.properties.hibernate.default_schema=rigel
spring.datasource.username=rigel_root
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.open-in-view=false
# Server Configuration
server.port=8080
spring.thymeleaf.check-template-location=false
# JWT Configuration
jwt.secret=mySuperSecretKeyThatIsAtLeast32CharactersLong123!
jwt.expiration=3600000
jwt.refresh=86400000
# Logging
logging.pattern.level=%5p [corr:%X{correlationId:-N/A}]
logging.level.com.korebit.rigel.interceptor.LogInterceptor=DEBUG
origin=http://localhost:5173
# Cloudinary Configuration (optional)
cloudinary.api-key=
cloudinary.api-secret=
cloudinary.cloud-name=
cloudinary.folder=rigel/products
# Image Storage Configuration
image.storage.local-path=./uploads
