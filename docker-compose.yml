# Rigel Collection: database + backend + frontend.
#
#   cp .env.example .env    # then fill in the secrets
#   docker compose up -d --build
#
# The app is served on http://localhost:${FRONTEND_PORT} and, because the published ports listen on
# every interface, on http://<this-machine-LAN-ip>:${FRONTEND_PORT} for other devices on the network.

name: rigel

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-rigel_db}
      POSTGRES_USER: ${DB_USERNAME:-rigel_root}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./rigel
    image: rigel-backend:${RIGEL_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-rigel_db}
      DB_USERNAME: ${DB_USERNAME:-rigel_root}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (openssl rand -base64 48)}
      # Public URL of the frontend: allowed CORS origin and base of the links sent by email.
      ORIGIN: ${ORIGIN:-http://localhost:5173}
      # Only needed when a frontend on another LAN host calls the backend port directly;
      # the bundled frontend goes through its own /api proxy and is always same-origin.
      CORS_LOCAL_NETWORK: ${CORS_LOCAL_NETWORK:-false}
      CORS_LOCAL_NETWORK_PATTERNS: ${CORS_LOCAL_NETWORK_PATTERNS:-http://192.168.0.*:[*]}
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_ADDRESS: ${EMAIL_ADDRESS:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    volumes:
      - uploads:/app/uploads
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: ./rigel_dream
      args:
        VITE_API_BASE: /api
    image: rigel-frontend:${RIGEL_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "${FRONTEND_PORT:-5173}:80"

volumes:
  db-data:
  uploads:
